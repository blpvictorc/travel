                    { time: "18:30", title: "亞拉河畔南岸晚餐", desc: "在南岸景觀餐廳享用摩登澳洲菜與紅酒[cite: 12]。" }
                ]
            },
            {
                day: 12, date: "11月11日", region: "mel", title: "丹頓農山脈百年蒸汽小火車之旅", hotel: "CAUSEWAY 353 HOTEL",
                image: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=800&q=80",
                summary: "搭乘 Puffing Billy 蒸汽火車，雙腳盪在車窗外穿梭蕨類雨林，午後漫步霍西爾巷塗鴉牆[cite: 13]。",
                details: [
                    { time: "11:00-12:00", title: "蒸汽小火車體驗", desc: "坐在火車窗框上，雙腳盪在外面，穿梭在經典高架橋與巨型蕨類樹林中[cite: 13]。" },
                    { time: "16:30-18:30", title: "市區探索", desc: "逛逛墨爾本著名的網紅塗鴉牆霍西爾巷[cite: 13]。" }
                ]
            },
            {
                day: 13, date: "11月12日", region: "mel", title: "QVM 美食早市×彩虹小屋×企鵝歸巢", hotel: "CAUSEWAY 353 HOTEL",
                image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
                summary: "女王市場品嚐甜甜圈與生蠔，布萊頓海灘彩色小屋打卡，傍晚前往菲利普島觀賞企鵝歸巢[cite: 14]。",
                details: [
                    { time: "10:00-12:00", title: "維多利亞女王市場 (QVM) Brunch", desc: "掃街品嚐甜甜圈、拿鐵、土耳其餡餅與新鮮生蠔[cite: 14]。" },
                    { time: "19:30-21:15", title: "Penguin Plus 企鵝歸巢體驗", desc: "觀看成群結隊的小企鵝超近距離搖擺經過[cite: 14]。" }
                ]
            },
            {
                day: 14, date: "11月13日", region: "mel", title: "國泰商務艙奢華返港", hotel: "甜蜜溫馨的家",
                image: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=800&q=80",
                summary: "享受墨爾本機場貴賓室，搭乘國泰航空 CX134 商務艙直飛香港，完美結束14天旅程[cite: 1]。",
                details: [
                    { time: "05:00", title: "前往機場與貴賓室早餐", desc: "進入國泰合作貴賓室享用現點現做澳式熱早餐[cite: 1]。" },
                    { time: "07:25", title: "搭乘國泰航空 CX134 商務艙直飛香港", desc: "在萬呎高空享用商務艙多道菜式午餐與美酒降落香港[cite: 1]。" }
                ]
            }
        ];

        let tripData = JSON.parse(localStorage.getItem('my_trip_data')) || defaultTripData;
        let currentEditingDay = null;
        let editingItemIndex = null;

        // 渲染主畫面列表
        function renderItinerary(filter = 'all') {
            const listEl = document.getElementById('itinerary-list');
            listEl.innerHTML = '';

            const filtered = filter === 'all' ? tripData : tripData.filter(item => item.region === filter);

            filtered.forEach(item => {
                let regionBadgeColor = 'bg-amber-100 text-amber-800 border border-amber-300';
                let regionName = '新加坡';
                if(item.region === 'wa') { regionBadgeColor = 'bg-orange-100 text-orange-800 border border-orange-300'; regionName = '西澳'; }
                if(item.region === 'mel') { regionBadgeColor = 'bg-sky-100 text-sky-800 border border-sky-300'; regionName = '墨爾本'; }

                const card = document.createElement('div');
                card.className = 'sun-card rounded-2xl overflow-hidden cursor-pointer';
                card.onclick = () => openModal(item.day);
                card.innerHTML = `
                    <div class="relative h-36 w-full overflow-hidden bg-slate-200">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105" loading="lazy">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/70 via-transparent to-transparent"></div>
                        <div class="absolute top-3 left-3 flex gap-2">
                            <span class="bg-gradient-to-r from-orange-500 to-amber-500 text-white text-xs font-black px-3 py-1 rounded-full shadow-md">
                                DAY ${item.day} · ${item.date}
                            </span>
                        </div>
                        <div class="absolute top-3 right-3">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${regionBadgeColor} backdrop-blur-md shadow-sm">
                                ${regionName}
                            </span>
                        </div>
                        <div class="absolute bottom-3 left-3 right-3 text-white">
                            <h3 class="text-sm sm:text-base font-extrabold leading-snug drop-shadow-md line-clamp-1">
                                ${item.title}
                            </h3>
                        </div>
                    </div>
                    <div class="p-4">
                        <p class="text-xs text-slate-600 line-clamp-2 mb-3 leading-relaxed">
                            ${item.summary}
                        </p>
                        <div class="flex items-center justify-between pt-2 border-t border-amber-100 text-xs">
                            <span class="text-slate-600 font-semibold truncate max-w-[210px]">🏨 ${item.hotel}</span>
                            <span class="text-orange-600 font-bold flex items-center gap-1">
                                編輯與查看詳細 →
                            </span>
                        </div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // 地區篩選切換
        function filterDestination(region, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn flex-none px-4 py-2 rounded-full text-xs font-bold bg-white text-slate-700 border border-amber-200 shadow-sm hover:bg-amber-50 transition-all';
            });
            btnElement.className = 'filter-btn flex-none px-4 py-2 rounded-full text-xs font-black bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-md transition-all scale-105';
            
            renderItinerary(region);
        }

        // 開啟詳細 Modal
        function openModal(dayNum) {
            currentEditingDay = dayNum;
            const data = tripData.find(d => d.day === dayNum);
            if (!data) return;

            document.getElementById('modal-day-badge').innerText = `DAY ${data.day} · ${data.date}`;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-hotel').innerText = `🏨 今日住宿：${data.hotel}`;
            
            const headerEl = document.getElementById('modal-header');
            headerEl.style.backgroundImage = `url('${data.image}')`;

            sortDetailsByTime(data);
            renderModalBody(data);

            const modal = document.getElementById('detail-modal');
            const box = document.getElementById('modal-content-box');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('translate-y-full');
            }, 10);
            document.body.style.overflow = 'hidden';
        }

        // 智慧時間格式化工具：把 "0900" 轉成 "09:00"，"0900-1430" 轉成 "09:00-14:30"
        function smartFormatTime(inputStr) {
            if(!inputStr) return "全天";
            // 尋找字串中的數字組合進行轉換
            return inputStr.replace(/\b(\d{1,2})(\d{2})\b/g, (match, h, m) => {
                return h.padStart(2, '0') + ':' + m;
            });
        }

        // 核心功能：依據時間自動排序 details 陣列
        function sortDetailsByTime(data) {
            data.details.sort((a, b) => {
                const getTimeVal = (str) => {
                    const match = str.match(/\d{2}:\d{2}|\b\d{3,4}\b/);
                    if (!match) return "99:99";
                    let t = match[0];
                    if(t.length === 3 || t.length === 4) {
                        t = t.padStart(4, '0');
                        t = t.slice(0,2) + ':' + t.slice(2);
                    }
                    return t;
                };
                return getTimeVal(a.time).localeCompare(getTimeVal(b.time));
            });
        }

        // 渲染 Modal 內部手機友善卡片
        function renderModalBody(data) {
            const bodyEl = document.getElementById('modal-body');
            bodyEl.innerHTML = '';

            data.details.forEach((detail, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white p-3.5 rounded-2xl border border-amber-200/80 shadow-xs space-y-2';
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="bg-amber-100 text-amber-900 text-[11px] font-black px-2.5 py-0.5 rounded-full">
                            ⏱ ${detail.time}
                        </span>
                        <div class="flex items-center gap-1">
                            <button onclick="moveItem(${index}, -1)" class="w-7 h-7 bg-slate-100 hover:bg-amber-100 text-slate-700 rounded-lg text-xs font-bold shadow-2xs" title="上移">⬆️</button>
                            <button onclick="moveItem(${index}, 1)" class="w-7 h-7 bg-slate-100 hover:bg-amber-100 text-slate-700 rounded-lg text-xs font-bold shadow-2xs" title="下移">⬇️</button>
                            <button onclick="openEditItemModal(${index})" class="w-7 h-7 bg-orange-100 hover:bg-orange-200 text-orange-700 rounded-lg text-xs font-bold shadow-2xs" title="編輯">✏️</button>
                            <button onclick="deleteItem(${index})" class="w-7 h-7 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg text-xs font-bold shadow-2xs" title="刪除">🗑️</button>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-xs sm:text-sm font-extrabold text-slate-800">${detail.title}</h4>
                        <p class="text-xs text-slate-600 leading-relaxed mt-1">${detail.desc}</p>
                    </div>
                `;
                bodyEl.appendChild(card);
            });
        }

        // 上下移動項目
        function moveItem(index, direction) {
            const data = tripData.find(d => d.day === currentEditingDay);
            if(!data) return;
            const newIndex = index + direction;
            if(newIndex < 0 || newIndex >= data.details.length) return;
            
            const temp = data.details[index];
            data.details[index] = data.details[newIndex];
            data.details[newIndex] = temp;
            
            sortDetailsByTime(data); // 排序
            saveData();
            renderModalBody(data);
        }

        // 刪除項目
        function deleteItem(index) {
            const data = tripData.find(d => d.day === currentEditingDay);
            if(!data) return;
            data.details.splice(index, 1);
            saveData();
            renderModalBody(data);
        }

        // 開啟新增項目彈窗
        function openAddItemModal() {
            editingItemIndex = null;
            document.getElementById('item-modal-title').innerText = "新增行程項目";
            document.getElementById('edit-time').value = "1000-1100";
            document.getElementById('edit-title').value = "";
            document.getElementById('edit-desc').value = "";
            document.getElementById('add-item-modal').classList.remove('hidden');
        }

        // 開啟編輯現有項目彈窗
        function openEditItemModal(index) {
            editingItemIndex = index;
            const data = tripData.find(d => d.day === currentEditingDay);
            const item = data.details[index];
            
            document.getElementById('item-modal-title').innerText = "編輯行程項目";
            document.getElementById('edit-time').value = item.time;
            document.getElementById('edit-title').value = item.title;
            document.getElementById('edit-desc').value = item.desc;
            document.getElementById('add-item-modal').classList.remove('hidden');
        }

        function closeItemModal() {
            document.getElementById('add-item-modal').classList.add('hidden');
        }

        // 儲存項目 (自動轉化 0900 -> 09:00 並自動重新按時間排序)
        function saveItemModal() {
            let rawTime = document.getElementById('edit-time').value.trim() || "全天";
            const time = smartFormatTime(rawTime); // 自動轉格式
            const title = document.getElementById('edit-title').value.trim() || "未命名行程";
            const desc = document.getElementById('edit-desc').value.trim() || "";

            const data = tripData.find(d => d.day === currentEditingDay);
            if(data) {
                if(editingItemIndex === null) {
                    data.details.push({ time, title, desc });
                } else {
                    data.details[editingItemIndex] = { time, title, desc };
                }
                
                sortDetailsByTime(data); // 自動排序
                saveData();
                renderModalBody(data);
            }
            closeItemModal();
        }

        // 還原當日預設
        function resetDayData() {
            if(confirm("確定要將這一日的行程還原為最初預設嗎？")) {
                const def = defaultTripData.find(d => d.day === currentEditingDay);
                const current = tripData.find(d => d.day === currentEditingDay);
                if(def && current) {
                    current.details = JSON.parse(JSON.stringify(def.details));
                    sortDetailsByTime(current);
                    saveData();
                    renderModalBody(current);
                }
            }
        }

        // 儲存至 LocalStorage
        function saveData() {
            localStorage.setItem('my_trip_data', JSON.stringify(tripData));
            renderItinerary('all');
        }

        // 關閉 Modal
        function closeModal() {
            const modal = document.getElementById('detail-modal');
            const box = document.getElementById('modal-content-box');
            modal.classList.add('opacity-0');
            box.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        }

        // 點擊背景關閉
        document.getElementById('detail-modal').addEventListener('click', (e) => {
            if (e.target.id === 'detail-modal') closeModal();
        });

        // 初始化載入全部
        renderItinerary('all');
    </script>
</body>
</html>
